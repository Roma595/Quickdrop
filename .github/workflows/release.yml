name: Build and Release QuickDrop

# Триггер: запускать только когда мы пушим тег, начинающийся на 'v' (например, v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Разрешения для токена (нужны для создания релиза)
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest # Используем стандартный сервер GitHub на базе Ubuntu
    
    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Укажи версию Go, которую ты используешь (или 'stable')

      # 3. Запускаем наш Makefile для сборки и упаковки в ZIP
      - name: Build and package
        run: make release

      # 4. Создаем релиз на GitHub и загружаем туда ZIP-архивы
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true # GitHub сам напишет красивое описание релиза на основе твоих коммитов